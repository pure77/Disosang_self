<svg viewBox="0 0 900 575" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif">
  <title>Disosang ERD — 핵심 도메인</title>
  <desc>users, store, category, category_mapping, store_search_token, review, photo, favorite 8개 테이블의 관계도.</desc>
  <style>
    .ent{ fill:#ffffff; stroke:#cfd4da; }
    .hN{ fill:#EEF1F4; stroke:#cfd4da; }
    .hC{ fill:#E8F3DE; stroke:#6DB33F; }
    .name{ fill:#1a1a1a; font-weight:700; font-size:13px; }
    .col{ fill:#333333; font-size:11.5px; }
    .pk{ fill:#1a1a1a; font-weight:700; font-size:11.5px; }
    .tag{ font-size:9px; font-weight:700; }
    .tpk{ fill:#B8860B; } .tfk{ fill:#4479A1; } .tuq{ fill:#8a8a8a; }
    .rel{ stroke:#9a9a9a; stroke-width:1.5; fill:none; }
    .muted{ fill:#8a8a8a; font-size:9.5px; }
  </style>
  <defs>
    <marker id="many" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1,7 L11,1 M1,7 L11,7 M1,7 L11,13" stroke="#9a9a9a" stroke-width="1.3" fill="none"/>
    </marker>
    <marker id="one" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M6,1 L6,11" stroke="#9a9a9a" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="900" height="575" fill="#ffffff"/>

  <!-- ===== relationships (parent -> child) ===== -->
  <path class="rel" d="M240,122 C285,122 285,270 310,270" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M140,184 L140,210" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M40,90 C8,90 8,150 40,150" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M540,250 C600,250 600,110 640,110" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M540,300 C600,300 605,292 640,292" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M540,360 C600,360 600,463 640,463" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M425,388 L425,440" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M510,92 C640,92 700,160 700,230" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M360,154 C300,154 300,490 310,490" marker-start="url(#one)" marker-end="url(#many)"/>
  <path class="rel" d="M745,354 L745,410" marker-start="url(#one)" marker-end="url(#many)"/>

  <!-- ===== users ===== -->
  <g transform="translate(310,30)">
    <rect class="ent" width="200" height="124" rx="7"/>
    <rect class="hN" width="200" height="26" rx="7"/>
    <text class="name" x="100" y="18" text-anchor="middle">users</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">user_id</text>
    <text class="tag tuq" x="12" y="62">UQ</text><text class="col" x="40" y="62">email</text>
    <text class="col" x="40" y="80">name</text>
    <text class="col" x="40" y="98">password</text>
    <text class="col" x="40" y="116">is_active</text>
  </g>

  <!-- ===== category ===== -->
  <g transform="translate(40,60)">
    <rect class="ent" width="200" height="124" rx="7"/>
    <rect class="hN" width="200" height="26" rx="7"/>
    <text class="name" x="100" y="18" text-anchor="middle">category</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">id</text>
    <text class="tag tfk" x="12" y="62">FK</text><text class="col" x="40" y="62">parent_id  (self)</text>
    <text class="tag tuq" x="12" y="80">UQ</text><text class="col" x="40" y="80">name</text>
    <text class="col" x="40" y="98">depth</text>
    <text class="col" x="40" y="116">group_code</text>
  </g>

  <!-- ===== category_mapping ===== -->
  <g transform="translate(40,210)">
    <rect class="ent" width="200" height="70" rx="7"/>
    <rect class="hN" width="200" height="26" rx="7"/>
    <text class="name" x="100" y="18" text-anchor="middle">category_mapping</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">raw_category</text>
    <text class="tag tfk" x="12" y="62">FK</text><text class="col" x="40" y="62">category_id</text>
  </g>

  <!-- ===== store (core) ===== -->
  <g transform="translate(310,210)">
    <rect class="ent" width="230" height="178" rx="7"/>
    <rect class="hC" width="230" height="26" rx="7"/>
    <text class="name" x="115" y="18" text-anchor="middle">store  ★</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">store_id</text>
    <text class="tag tfk" x="12" y="62">FK</text><text class="col" x="40" y="62">category_id</text>
    <text class="col" x="40" y="80">place_name</text>
    <text class="col" x="40" y="98">place_name_search</text>
    <text class="col" x="40" y="116">location  (POINT · 4326)</text>
    <text class="col" x="40" y="134">store_type</text>
    <text class="col" x="40" y="152">review_count</text>
    <text class="col" x="40" y="170">average_rating</text>
  </g>

  <!-- ===== favorite ===== -->
  <g transform="translate(310,440)">
    <rect class="ent" width="230" height="104" rx="7"/>
    <rect class="hN" width="230" height="26" rx="7"/>
    <text class="name" x="115" y="18" text-anchor="middle">favorite</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">favorite_id</text>
    <text class="tag tfk" x="12" y="62">FK</text><text class="col" x="40" y="62">user_id</text>
    <text class="tag tfk" x="12" y="80">FK</text><text class="col" x="40" y="80">store_id</text>
    <text class="muted" x="40" y="97">UQ (user_id, store_id)</text>
  </g>

  <!-- ===== store_search_token (core) ===== -->
  <g transform="translate(640,40)">
    <rect class="ent" width="210" height="124" rx="7"/>
    <rect class="hC" width="210" height="26" rx="7"/>
    <text class="name" x="105" y="18" text-anchor="middle">store_search_token  ★</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="tag tfk" x="30" y="44">FK</text><text class="pk" x="52" y="44">store_id</text>
    <text class="tag tpk" x="12" y="62">PK</text><text class="pk" x="52" y="62">field_type</text>
    <text class="tag tpk" x="12" y="80">PK</text><text class="pk" x="52" y="80">token</text>
    <text class="tag tpk" x="12" y="98">PK</text><text class="pk" x="52" y="98">pos</text>
    <text class="col" x="52" y="116">token_len</text>
  </g>

  <!-- ===== review ===== -->
  <g transform="translate(640,230)">
    <rect class="ent" width="210" height="124" rx="7"/>
    <rect class="hN" width="210" height="26" rx="7"/>
    <text class="name" x="105" y="18" text-anchor="middle">review</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">review_id</text>
    <text class="tag tfk" x="12" y="62">FK</text><text class="col" x="40" y="62">store_id</text>
    <text class="tag tfk" x="12" y="80">FK</text><text class="col" x="40" y="80">user_id</text>
    <text class="col" x="40" y="98">rating</text>
    <text class="col" x="40" y="116">content</text>
  </g>

  <!-- ===== photo ===== -->
  <g transform="translate(640,410)">
    <rect class="ent" width="210" height="106" rx="7"/>
    <rect class="hN" width="210" height="26" rx="7"/>
    <text class="name" x="105" y="18" text-anchor="middle">photo</text>
    <text class="tag tpk" x="12" y="44">PK</text><text class="pk" x="40" y="44">photo_id</text>
    <text class="tag tfk" x="12" y="62">FK</text><text class="col" x="40" y="62">review_id</text>
    <text class="tag tfk" x="12" y="80">FK</text><text class="col" x="40" y="80">store_id</text>
    <text class="col" x="40" y="98">file_url</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,330)">
    <text class="muted" x="0" y="0">★ 검색 엔진 핵심 테이블   ·   ⊢&lt; 1 : N 관계</text>
  </g>
</svg>
