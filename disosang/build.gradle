plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pmh'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)   // LTS. Gradle이 ~/.jdks 등에서 설치된 JDK 25를 자동 감지
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// Mockito를 -javaagent로 명시 로딩하기 위한 설정 (JDK 21+ 동적 에이전트 경고 제거)
	mockitoAgent
}

repositories {
	mavenCentral()
}

dependencies {

	//spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'   // Boot 4: starter-web은 deprecated 이름
	// Lombok은 javac 내부 API를 쓰므로 JDK 메이저마다 지원 버전을 직접 고정 (JDK 25: 1.18.40+)
	compileOnly 'org.projectlombok:lombok:1.18.46'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway: 스키마 마이그레이션. Boot 4부터는 서드파티 직접 의존 대신 스타터 필수 (버전은 BOM 관리, 4.1.1 기준 12.4.0)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'   // MySQL 방언 모듈은 별도
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'   // 3.x = Boot 4 / Jackson 3 라인

	//csv
	implementation 'com.opencsv:opencsv:5.7.1'
}

// deprecated API 사용을 컴파일 시 전부 드러낸다. 메이저 업그레이드(Boot 4.1) 전에 제거 대상을 찾기 위해 켬.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('test') {
	useJUnitPlatform()
	// Mockito 인라인 목 에이전트를 기동 시 명시 로딩. 없으면 JDK 21+에서
	// "dynamically loaded agent" 경고가 나고, 향후 JDK는 기본적으로 막을 예정.
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}
